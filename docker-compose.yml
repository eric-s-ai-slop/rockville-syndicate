version: '3.8'

services:
  project-omega:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-MY_GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
    restart: always
