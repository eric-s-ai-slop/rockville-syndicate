version: '3.8'

services:
  project-omega:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3324}:3324"
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL:-http://localhost:3324}
    volumes:
      - ./db_data:/app/db_data
    restart: always
